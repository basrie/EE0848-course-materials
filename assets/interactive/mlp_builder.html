<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex,nofollow,noarchive">
<meta charset="utf-8">
<title>Interactive MLP builder</title>
<style>
  :root { --blue: #1c5b84; --orange: #b7410e; --lblue: #dceaf4; --lorange: #f4e3dc; }
  html, body { margin: 0; padding: 0; background: transparent; font-family: 'Quicksand', system-ui, sans-serif; color: #333; }
  .wrap { display: grid; grid-template-columns: 260px 1fr; gap: 16px; padding: 14px; }
  .panel { background: rgba(255,255,255,0.7); border: 1px solid #cfdbe3; border-radius: 8px; padding: 12px 14px; }
  h3 { margin: 0 0 10px; color: var(--blue); font-size: 16px; font-weight: 700; }
  label { display: block; margin: 8px 0 4px; font-size: 14px; font-weight: 600; color: var(--blue); }
  .row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .row input[type=range] { flex: 1; accent-color: var(--blue); }
  .row .val { width: 28px; text-align: right; color: var(--orange); font-weight: 700; }
  .neurons { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .stats { margin-top: 12px; font-size: 13px; color: #444; line-height: 1.6; }
  .stats b { color: var(--blue); }
  svg { width: 100%; height: 520px; background: transparent; }
  .hint { font-size: 12px; color: #666; font-style: italic; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h3>MLP builder</h3>
    <label>Input features<span style="float:right;color:var(--orange);" id="inVal">3</span></label>
    <input type="range" id="inSize" min="1" max="8" value="3" style="width:100%;accent-color:var(--blue)">

    <label>Hidden layers<span style="float:right;color:var(--orange);" id="nhVal">2</span></label>
    <input type="range" id="nh" min="0" max="4" value="2" style="width:100%;accent-color:var(--blue)">

    <div class="neurons" id="hiddenCtrls"></div>

    <label>Output units<span style="float:right;color:var(--orange);" id="outVal">2</span></label>
    <input type="range" id="outSize" min="1" max="6" value="2" style="width:100%;accent-color:var(--blue)">

    <div class="stats" id="stats"></div>
    <div class="hint">Drag sliders → diagram & parameter count update instantly.</div>
  </div>

  <div class="panel" style="padding:6px 0 0 0;">
    <svg id="net" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
</div>

<script>
const BLUE = '#1c5b84', ORANGE = '#b7410e', LBLUE = '#dceaf4', LORANGE = '#f4e3dc', EDGE = '#9fb8ca';

const state = {
  input: 3,
  hidden: [5, 5],
  output: 2,
};

function renderHiddenCtrls() {
  const el = document.getElementById('hiddenCtrls');
  el.innerHTML = '';
  state.hidden.forEach((n, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <span style="width:46px;">H${i+1}</span>
      <input type="range" min="1" max="10" value="${n}" data-i="${i}">
      <span class="val" id="h${i}val">${n}</span>`;
    el.appendChild(row);
    row.querySelector('input').oninput = (e) => {
      state.hidden[i] = +e.target.value;
      document.getElementById(`h${i}val`).textContent = e.target.value;
      draw();
    };
  });
}

function setHiddenCount(n) {
  const cur = state.hidden;
  if (n > cur.length) {
    for (let i = cur.length; i < n; i++) cur.push(5);
  } else cur.length = n;
  renderHiddenCtrls();
}

function draw() {
  const svg = document.getElementById('net');
  svg.innerHTML = '';
  const W = 900, H = 520;
  const layers = [state.input, ...state.hidden, state.output];
  const labels = ['Input',
    ...state.hidden.map((_, i) => `Hidden ${i+1}`),
    'Output'];
  const nLayers = layers.length;
  const margin = { t: 46, b: 60 };
  // Fixed compact spacing between layers; cluster centered in canvas
  const LAYER_GAP = 150;
  const totalW = (nLayers - 1) * LAYER_GAP;
  const xStart = (W - totalW) / 2;
  const xs = layers.map((_, i) => xStart + i * LAYER_GAP);

  const maxN = Math.max(...layers);
  const R = 26;                                   // bigger neurons
  const minStep = 2 * R + 8;                      // keep circles from overlapping
  // Node y positions centered per layer
  const nodePositions = layers.map((n, li) => {
    const xi = xs[li];
    const available = H - margin.t - margin.b;
    const step = n === 1 ? 0 :
      Math.max(minStep, Math.min(available / (maxN - 1), 62));
    const totalH = (n - 1) * step;
    const y0 = margin.t + (available - totalH) / 2;
    const pts = [];
    for (let j = 0; j < n; j++) pts.push({ x: xi, y: y0 + j * step });
    return pts;
  });

  // Draw edges
  for (let li = 0; li < nodePositions.length - 1; li++) {
    for (const a of nodePositions[li]) {
      for (const b of nodePositions[li + 1]) {
        svg.innerHTML += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${EDGE}" stroke-width="1.1" opacity="0.55"/>`;
      }
    }
  }
  // Draw nodes (last layer is output → orange)
  nodePositions.forEach((pts, li) => {
    const isOutput = li === nodePositions.length - 1;
    const fill = isOutput ? LORANGE : LBLUE;
    const stroke = isOutput ? ORANGE : BLUE;
    for (const p of pts) {
      svg.innerHTML += `<circle cx="${p.x}" cy="${p.y}" r="${R}" fill="${fill}" stroke="${stroke}" stroke-width="2.6"/>`;
    }
  });
  // Layer labels (below)
  xs.forEach((x, li) => {
    svg.innerHTML += `<text x="${x}" y="${H - 22}" text-anchor="middle" fill="${BLUE}" font-size="15" font-weight="700">${labels[li]}</text>`;
    svg.innerHTML += `<text x="${x}" y="${H - 6}" text-anchor="middle" fill="#666" font-size="12" font-style="italic">${layers[li]} unit${layers[li]>1?'s':''}</text>`;
  });
  // Title
  svg.innerHTML += `<text x="${W/2}" y="22" text-anchor="middle" fill="${BLUE}" font-size="16" font-weight="700">${state.hidden.length === 0 ? 'Linear model (no hidden layer)' : 'Multilayer Perceptron — ' + state.hidden.length + ' hidden layer' + (state.hidden.length>1?'s':'')}</text>`;

  // Stats: weight + bias counts
  let weights = 0, biases = 0;
  for (let li = 0; li < layers.length - 1; li++) {
    weights += layers[li] * layers[li + 1];
    biases += layers[li + 1];
  }
  const total = weights + biases;
  const chain = layers.join(' → ');
  document.getElementById('stats').innerHTML =
    `<b>Architecture:</b> ${chain}<br>` +
    `<b>Weights:</b> ${weights.toLocaleString()}<br>` +
    `<b>Biases:</b> ${biases.toLocaleString()}<br>` +
    `<b>Trainable params:</b> ${total.toLocaleString()}`;
}

// Wire controls
document.getElementById('inSize').oninput = (e) => {
  state.input = +e.target.value;
  document.getElementById('inVal').textContent = e.target.value;
  draw();
};
document.getElementById('outSize').oninput = (e) => {
  state.output = +e.target.value;
  document.getElementById('outVal').textContent = e.target.value;
  draw();
};
document.getElementById('nh').oninput = (e) => {
  const n = +e.target.value;
  document.getElementById('nhVal').textContent = e.target.value;
  setHiddenCount(n);
  draw();
};

renderHiddenCtrls();
draw();
</script>
</body>
</html>
